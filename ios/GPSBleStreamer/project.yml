name: GPSBleStreamer
options:
  deploymentTarget:
    iOS: "14.0"
targets:
  GPSBleStreamer:
    type: application
    platform: iOS
    sources:
      - path: GPSBleStreamer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.gpsblestreamer
      INFOPLIST_FILE: GPSBleStreamer/Info.plist
      SWIFT_VERSION: 5.0
    dependencies: []
  GPSBleStreamerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GPSBleStreamerTests
    dependencies:
      - target: GPSBleStreamer
